name: Current-head safety verification
on:
  push:
    branches: [audit/current-head-20260915]
    paths: [.github/workflows/current-head-safety-verification.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.repository == 'Hylouis233/codex-new-invite'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stage the review files on the exact original source
        run: |
          set -euo pipefail
          git show HEAD:.github/maintenance/apply-current-head-safety.py > "$RUNNER_TEMP/apply-safety.py"
          git show HEAD:.github/maintenance/current_head_security_test.go.txt > "$RUNNER_TEMP/current_head_security_test.go"
          git checkout --detach 926c388f16826509ccbb676cb29135f39433d8c8
          test "$(git rev-parse HEAD^{tree})" = e6ddabdf3c12590038e5146a3e0f7d9b4b2ef443
          cp "$RUNNER_TEMP/current_head_security_test.go" current_head_security_test.go
          mkdir -p "$RUNNER_TEMP/safety-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/safety-evidence/original-identity.txt"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare locked dependencies and compile the baseline test binary
        run: |
          set -euo pipefail
          go version | tee "$RUNNER_TEMP/safety-evidence/go-version.txt"
          go mod download
          go test -mod=readonly -c -o "$RUNNER_TEMP/baseline.test" .
          git diff --quiet -- go.mod go.sum
      - name: Prove all six regression groups detect the original defects
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/safety-evidence"
          set +e
          sudo unshare --net bash -c 'ip link set lo up; exec "$@"' _ "$RUNNER_TEMP/baseline.test" -test.v -test.run '^TestCurrentHead' -test.timeout 90s > "$evidence/baseline-negative.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'safety-evidence'
          log = (root/'baseline-negative.log').read_text()
          expected = {
            'TestCurrentHeadDispatchPinsCredentialOrigin',
            'TestCurrentHeadQueryRoutesRejectInvalidBodiesBeforeCredentials',
            'TestCurrentHeadCDKDispatchRequiresExplicitDestination',
            'TestCurrentHeadCDKRedirectAndResponseBoundaries',
            'TestCurrentHeadActivationHooksAreRetired',
            'TestCurrentHeadAmbiguousInviteDoesNotFallBack',
          }
          failed = set(re.findall(r'^--- FAIL: (TestCurrentHead\w+) ', log, re.M))
          assert failed == expected, f'Negative control did not detect each defect: {sorted(failed)}'
          assert 'panic:' not in log and 'test timed out' not in log
          (root/'negative-control-summary.txt').write_text('All six new regression groups fail on the unchanged original implementation.\nNo network interface except loopback existed during execution.\n')
          PY
      - name: Apply only the four-file candidate and verify its identity
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/apply-safety.py"
          gofmt -w current_head_security_test.go
          git add main.go security.go README.md current_head_security_test.go
          test "$(git write-tree)" = 4cd8f13da8011ef75d3641ec034b77af63a3e01e
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --quiet
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/safety-evidence/tested-tree.txt"
          git diff --cached --name-status > "$RUNNER_TEMP/safety-evidence/tested-files.txt"
      - name: Run all tests, vet, and race checks inside a loopback-only network namespace
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/safety-evidence"
          GO_BIN=$(command -v go)
          export GOPATH=$(go env GOPATH)
          export GOCACHE=$(go env GOCACHE)
          export GOMODCACHE=$(go env GOMODCACHE)
          offline() {
            sudo env PATH="$PATH" GOPATH="$GOPATH" GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off \
              unshare --net bash -c 'ip link set lo up; exec "$@"' _ "$@"
          }
          offline "$GO_BIN" test -mod=readonly -count=1 -json -timeout=120s ./... > "$evidence/all-tests.jsonl" 2> "$evidence/all-tests.stderr"
          offline make vet > "$evidence/vet.log" 2>&1
          offline "$GO_BIN" test -mod=readonly -race -count=1 -json -timeout=120s ./... > "$evidence/race-tests.jsonl" 2> "$evidence/race-tests.stderr"
          git diff --quiet
          test "$(git write-tree)" = 4cd8f13da8011ef75d3641ec034b77af63a3e01e
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'safety-evidence'
          summary = {}
          for name in ('all-tests', 'race-tests'):
            rows = [json.loads(line) for line in (root/(name+'.jsonl')).read_text().splitlines() if line.strip()]
            tests = [r for r in rows if r.get('Test') and r['Action'] in ('pass','fail','skip')]
            counts = {key:sum(r['Action']==key for r in tests) for key in ('pass','fail','skip')}
            roots = {r['Test'] for r in tests if '/' not in r['Test']}
            new_roots = {r['Test'] for r in tests if r['Test'].startswith('TestCurrentHead') and '/' not in r['Test'] and r['Action']=='pass'}
            assert counts['fail']==0 and len(new_roots)==6 and roots, counts
            summary[name] = {'test_events':counts, 'top_level_groups':len(roots), 'new_regression_groups_passed':len(new_roots)}
          summary['scope']='Entire current module tests and vet on Linux, with outbound network unavailable during execution; no release, deployment, live invite, or credit redemption.'
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Preserve verification evidence, not original credential-bearing source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpa-current-head-safety-evidence
          path: ${{ runner.temp }}/safety-evidence/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Publish the validated candidate to a new review branch only
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show HEAD:.github/maintenance/apply-current-head-safety.py > "$RUNNER_TEMP/apply-safety.py"
          git show HEAD:.github/maintenance/current_head_security_test.go.txt > "$RUNNER_TEMP/current_head_security_test.go"
          git checkout --detach 926c388f16826509ccbb676cb29135f39433d8c8
          cp "$RUNNER_TEMP/current_head_security_test.go" current_head_security_test.go
          python "$RUNNER_TEMP/apply-safety.py"
          gofmt -w current_head_security_test.go
          git add main.go security.go README.md current_head_security_test.go
          test "$(git write-tree)" = 4cd8f13da8011ef75d3641ec034b77af63a3e01e
          git diff --quiet
          git diff --cached --check
          git config user.name 'Hong Liu'
          git config user.email '88263959+Hylouis233@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git commit -m 'fix: restore credential and request boundaries for current-head review' -m 'Pin dispatch credential origins, fail closed on malformed query bodies, require an explicit CDK destination without redirects, retire machine-local activation hooks, and preserve non-retrying behavior for ambiguous invite failures. Six regression groups detect the original defects; full module tests, vet and race checks passed with loopback-only networking. This is a scoped candidate, not a complete security approval; no production branch is updated.'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          ref=refs/heads/fix/current-head-safety-20260915
          current=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "$ref" | cut -f1)
          test -z "$current"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:$ref"
          unset auth PUSH_TOKEN
          git rev-parse HEAD HEAD^{tree} > final-identity.txt
          cat final-identity.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpa-current-head-safety-commit
          path: final-identity.txt
          retention-days: 7
          if-no-files-found: error
