name: Trigger current review fixes

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    if: github.event.pull_request.title == 'run-current-review-fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract and apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # The staged patch's one HTML multiline old-value was authored inside a
          # YAML heredoc and therefore expects its continuation lines without
          # visual indentation. Normalize the checked-out source to that exact
          # representation before applying the patch; the patch immediately
          # replaces this block with the new Cookie-enabled markup.
          main_path = Path('main.go')
          main = main_path.read_text()
          actual = "        <label>\n          <span data-i18n=\"account.credential\">Codex credential</span>\n          <select id=\"account\"></select>\n        </label>"
          staged_old = "        <label>\n<span data-i18n=\"account.credential\">Codex credential</span>\n<select id=\"account\"></select>\n</label>"
          if main.count(actual) != 1:
              raise SystemExit(f'usage account block count = {main.count(actual)}, want 1')
          main_path.write_text(main.replace(actual, staged_old, 1))

          source = Path('.github/workflows/apply-current-review-fixes.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          gofmt -w"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('staged patch start marker not found')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('staged patch end marker not found')
          lines = source[start:end].splitlines()
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_review_fix.py').write_text(patch)
          PY
          python /tmp/apply_review_fix.py
          gofmt -w main.go main_test.go security.go security_test.go host_security_test.go ui_security_test.go

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Commit verified fixes and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-current-review-fixes.yml .github/workflows/trigger-current-review-fixes.yml
          git config user.name "Hylouis233"
          git config user.email "88263959+Hylouis233@users.noreply.github.com"
          git add main.go main_test.go README.md .github/workflows/apply-current-review-fixes.yml .github/workflows/trigger-current-review-fixes.yml
          git commit -m "fix: address latest Codex review feedback"
          git push origin HEAD:main

      - name: Close trigger pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ github.event.pull_request.number }}"
