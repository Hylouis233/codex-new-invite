name: Trigger current review fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    if: github.event.pull_request.title == 'run-current-review-fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply current review fixes
        run: python .github/scripts/run_review_fix.py

      - name: Format
        run: gofmt -w main.go main_test.go security.go security_test.go host_security_test.go ui_security_test.go

      - name: Verify
        run: |
          go test ./...
          go vet ./...

      - name: Commit verified fixes
        run: |
          rm -f .github/workflows/apply-current-review-fixes.yml
          rm -f .github/workflows/trigger-current-review-fixes.yml
          rm -f .github/scripts/run_review_fix.py
          git config user.name "Hylouis233"
          git config user.email "88263959+Hylouis233@users.noreply.github.com"
          git add main.go main_test.go README.md .github/workflows/apply-current-review-fixes.yml .github/workflows/trigger-current-review-fixes.yml .github/scripts/run_review_fix.py
          git commit -m "fix: address latest Codex review feedback"
          git push origin HEAD:main

      - name: Close trigger pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ github.event.pull_request.number }}"
