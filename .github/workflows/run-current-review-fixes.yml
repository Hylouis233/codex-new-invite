name: Run current review fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: execute current review fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply current review fixes
        run: python .github/scripts/run_review_fix.py

      - name: Format
        run: gofmt -w main.go main_test.go security.go security_test.go host_security_test.go ui_security_test.go

      - name: Verify
        run: |
          go test ./...
          go vet ./...

      - name: Commit verified fixes and remove temporary machinery
        run: |
          rm -f .github/workflows/apply-current-review-fixes.yml
          rm -f .github/workflows/trigger-current-review-fixes.yml
          rm -f .github/workflows/run-current-review-fixes.yml
          rm -f .github/scripts/run_review_fix.py
          rm -f .github/review-fix-trigger
          git config user.name "Hylouis233"
          git config user.email "88263959+Hylouis233@users.noreply.github.com"
          git add -A
          git commit -m "fix: address latest Codex review feedback"
          git push origin HEAD:main
