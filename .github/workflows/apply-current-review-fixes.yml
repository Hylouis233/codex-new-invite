name: Apply current review fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: stage current review fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('main.go')
          test_path = Path('main_test.go')
          readme_path = Path('README.md')
          main = main_path.read_text()
          tests = test_path.read_text()
          readme = readme_path.read_text()

          def replace_once(old, new):
              global main
              count = main.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              main = main.replace(old, new, 1)

          def replace_n(old, new, expected):
              global main
              count = main.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} matches, found {count}: {old[:100]!r}')
              main = main.replace(old, new)

          def replace_region(start, end, new):
              global main
              i = main.find(start)
              if i < 0:
                  raise SystemExit(f'missing region start: {start!r}')
              j = main.find(end, i)
              if j < 0:
                  raise SystemExit(f'missing region end: {end!r}')
              main = main[:i] + new + main[j:]

          replace_once('"crypto/rand"\n\t"encoding/base64"', '"crypto/rand"\n\tstdtls "crypto/tls"\n\t"encoding/base64"')

          replace_once(
              '\tSource           string `json:"source,omitempty"`\n}',
              '\tSource           string `json:"source,omitempty"`\n\tReferralProgramID string `json:"referral_program_id,omitempty"`\n}',
          )

          replace_once(
              'func parseQueryRequest(body []byte) queryRequest {\n\tvar payload queryRequest\n\tif len(body) > 0 {\n\t\t_ = json.Unmarshal(body, &payload)\n\t}\n\treturn payload\n}',
              '''func parseQueryRequest(body []byte) (queryRequest, error) {
\tvar payload queryRequest
\ttrimmed := bytes.TrimSpace(body)
\tif len(trimmed) == 0 {
\t\treturn payload, nil
\t}
\tif len(trimmed) > maxManagementBodyBytes {
\t\treturn queryRequest{}, fmt.Errorf("request body is too large")
\t}
\tif errUnmarshal := json.Unmarshal(trimmed, &payload); errUnmarshal != nil {
\t\treturn queryRequest{}, fmt.Errorf("invalid JSON request body: %w", errUnmarshal)
\t}
\treturn payload, nil
}''',
          )

          handler_parse = '''payload, errPayload := parseQueryRequest(req.Body)
\tif errPayload != nil {
\t\treturn jsonResponse(http.StatusBadRequest, map[string]any{"error": errPayload.Error()})
\t}'''
          replace_n('payload := parseQueryRequest(req.Body)', handler_parse, 4)

          replace_once(
              '\tMaxInvites        any         `json:"max_invites,omitempty"`\n\tStatus            any         `json:"status,omitempty"`',
              '\tMaxInvites              any         `json:"max_invites,omitempty"`\n\tRemainingRewardCapacity any         `json:"remaining_reward_capacity,omitempty"`\n\tStatus                  any         `json:"status,omitempty"`',
          )
          replace_once(
              '\tResetCredits    any    `json:"reset_credits,omitempty"`\n\tResetCreditsHit bool   `json:"reset_credits_endpoint_hit,omitempty"`',
              '\tResetCredits          any    `json:"reset_credits,omitempty"`\n\tResetCreditsHit       bool   `json:"reset_credits_endpoint_hit,omitempty"`\n\tReferralCredits       any    `json:"referrals_credits,omitempty"`\n\tReferralCreditsHit    bool   `json:"referrals_credits_endpoint_hit,omitempty"`\n\tReferralCreditsStatus int    `json:"referrals_credits_status_code,omitempty"`',
          )

          account_helpers = '''func referralProgramForAccount(account accountInfo) string {
\tif account.ReferralProgramID == programIDWorkspace {
\t\treturn programIDWorkspace
\t}
\tfor _, value := range []string{account.Account, account.Label, account.Source} {
\t\tnormalized := strings.ToLower(strings.TrimSpace(value))
\t\tif strings.Contains(normalized, "workspace") || normalized == "team" || normalized == "business" || normalized == "enterprise" {
\t\t\treturn programIDWorkspace
\t\t}
\t}
\treturn programIDConsumer
}

func inferReferralProgram(file map[string]any) string {
\tif boolValue(file["is_workspace"]) || boolValue(file["workspace"]) {
\t\treturn programIDWorkspace
\t}
\tfor _, path := range [][]string{
\t\t{"workspace_id"}, {"team_id"},
\t\t{"id_token", "workspace_id"}, {"id_token", "team_id"},
\t} {
\t\tif nestedString(file, path...) != "" {
\t\t\treturn programIDWorkspace
\t\t}
\t}
\tfor _, value := range []string{
\t\tfirstString(file, "account_type", "plan_type", "chatgpt_plan_type", "workspace_type", "account"),
\t\tnestedString(file, "id_token", "account_type"),
\t\tnestedString(file, "id_token", "plan_type"),
\t\tnestedString(file, "id_token", "chatgpt_plan_type"),
\t} {
\t\tnormalized := strings.ToLower(strings.TrimSpace(value))
\t\tif strings.Contains(normalized, "workspace") || normalized == "team" || normalized == "business" || normalized == "enterprise" {
\t\t\treturn programIDWorkspace
\t\t}
\t}
\treturn programIDConsumer
}

'''
          replace_once('func fetchCodexAccounts(req pluginapi.ManagementRequest, explicitOrigin string) ([]accountInfo, error) {', account_helpers + 'func fetchCodexAccounts(req pluginapi.ManagementRequest, explicitOrigin string) ([]accountInfo, error) {')
          replace_once(
              '\t\t\tSource:           firstString(file, "source"),\n\t\t})',
              '\t\t\tSource:           firstString(file, "source"),\n\t\t\tReferralProgramID: inferReferralProgram(file),\n\t\t})',
          )

          replace_region(
              'func sendInvite(ctx context.Context,',
              '// sendInviteV2 posts to',
              '''func sendInvite(ctx context.Context, cfg pluginConfig, credential codexCredential, account accountInfo, emails []string, referralKey string, requestCookie string, proxyURL string) (inviteResponse, error) {
\tresult, errV2 := sendInviteV2(ctx, cfg, credential, account, emails, requestCookie, proxyURL)
\tif errV2 != nil {
\t\t// A transport/read error is ambiguous for a state-changing request: the server may
\t\t// already have accepted the invitation. Never retry it through the legacy endpoint.
\t\treturn inviteResponse{}, errV2
\t}
\tif result.OK {
\t\treturn result, nil
\t}
\tif !legacyInviteFallbackStatus(result.StatusCode) {
\t\treturn result, httpStatusError{status: http.StatusBadGateway, msg: fmt.Sprintf("V2 invite endpoint rejected request: status %d", result.StatusCode)}
\t}

\tlegacy, errLegacy := sendInviteLegacy(ctx, cfg, credential, account, emails, referralKey, requestCookie, proxyURL)
\tif errLegacy != nil {
\t\treturn inviteResponse{}, errLegacy
\t}
\tif !legacy.OK {
\t\treturn legacy, httpStatusError{status: http.StatusBadGateway, msg: fmt.Sprintf("legacy invite endpoint rejected request: status %d", legacy.StatusCode)}
\t}
\treturn legacy, nil
}

func legacyInviteFallbackStatus(status int) bool {
\tswitch status {
\tcase http.StatusNotFound, http.StatusMethodNotAllowed, http.StatusGone, http.StatusNotImplemented:
\t\treturn true
\tdefault:
\t\treturn false
\t}
}

''',
          )
          replace_once('"program_id": programIDConsumer,', '"program_id": referralProgramForAccount(account),')

          transport = '''type utlsRoundTripper struct {
\tmu          sync.Mutex
\tconnections map[string]*http2.ClientConn
\tpending     map[string]chan struct{}
\tdialer      proxy.Dialer
}

func newUtlsRoundTripper(dialer proxy.Dialer) *utlsRoundTripper {
\treturn &utlsRoundTripper{
\t\tconnections: make(map[string]*http2.ClientConn),
\t\tpending:     make(map[string]chan struct{}),
\t\tdialer:      dialer,
\t}
}

type proxyContextDialer interface {
\tDialContext(context.Context, string, string) (net.Conn, error)
}

func dialProxyContext(ctx context.Context, dialer proxy.Dialer, network, addr string) (net.Conn, error) {
\tif contextDialer, ok := dialer.(proxyContextDialer); ok {
\t\treturn contextDialer.DialContext(ctx, network, addr)
\t}
\ttype dialResult struct {
\t\tconn net.Conn
\t\terr  error
\t}
\tresultCh := make(chan dialResult, 1)
\tgo func() {
\t\tconn, err := dialer.Dial(network, addr)
\t\tresultCh <- dialResult{conn: conn, err: err}
\t}()
\tselect {
\tcase result := <-resultCh:
\t\treturn result.conn, result.err
\tcase <-ctx.Done():
\t\tgo func() {
\t\t\tresult := <-resultCh
\t\t\tif result.conn != nil {
\t\t\t\t_ = result.conn.Close()
\t\t\t}
\t\t}()
\t\treturn nil, ctx.Err()
\t}
}

func (t *utlsRoundTripper) getOrCreateConnection(ctx context.Context, host, addr string) (*http2.ClientConn, error) {
\tfor {
\t\tt.mu.Lock()
\t\tif h2Conn, ok := t.connections[host]; ok && h2Conn.CanTakeNewRequest() {
\t\t\tt.mu.Unlock()
\t\t\treturn h2Conn, nil
\t\t}
\t\tif stale, ok := t.connections[host]; ok {
\t\t\tdelete(t.connections, host)
\t\t\tt.mu.Unlock()
\t\t\t_ = stale.Close()
\t\t\tcontinue
\t\t}
\t\tif wait, ok := t.pending[host]; ok {
\t\t\tt.mu.Unlock()
\t\t\tselect {
\t\t\tcase <-wait:
\t\t\t\tcontinue
\t\t\tcase <-ctx.Done():
\t\t\t\treturn nil, ctx.Err()
\t\t\t}
\t\t}

\t\twait := make(chan struct{})
\t\tt.pending[host] = wait
\t\tt.mu.Unlock()

\t\th2Conn, errCreate := t.createConnection(ctx, host, addr)
\t\tt.mu.Lock()
\t\tdelete(t.pending, host)
\t\tif errCreate == nil {
\t\t\tt.connections[host] = h2Conn
\t\t}
\t\tclose(wait)
\t\tt.mu.Unlock()
\t\treturn h2Conn, errCreate
\t}
}

func (t *utlsRoundTripper) createConnection(ctx context.Context, host, addr string) (*http2.ClientConn, error) {
\tconn, errDial := dialProxyContext(ctx, t.dialer, "tcp", addr)
\tif errDial != nil {
\t\treturn nil, errDial
\t}
\tif deadline, ok := ctx.Deadline(); ok {
\t\t_ = conn.SetDeadline(deadline)
\t}

\ttlsConfig := &tls.Config{ServerName: host}
\ttlsConn := tls.UClient(conn, tlsConfig, tls.HelloChrome_Auto)
\thandshakeCh := make(chan error, 1)
\tgo func() { handshakeCh <- tlsConn.Handshake() }()
\tselect {
\tcase errHandshake := <-handshakeCh:
\t\tif errHandshake != nil {
\t\t\t_ = conn.Close()
\t\t\treturn nil, errHandshake
\t\t}
\tcase <-ctx.Done():
\t\t_ = conn.Close()
\t\treturn nil, ctx.Err()
\t}

\ttype clientConnResult struct {
\t\tconn *http2.ClientConn
\t\terr  error
\t}
\tnewConnCh := make(chan clientConnResult, 1)
\tgo func() {
\t\ttr := &http2.Transport{}
\t\th2Conn, errNew := tr.NewClientConn(tlsConn)
\t\tnewConnCh <- clientConnResult{conn: h2Conn, err: errNew}
\t}()
\tselect {
\tcase result := <-newConnCh:
\t\tif result.err != nil {
\t\t\t_ = tlsConn.Close()
\t\t\treturn nil, result.err
\t\t}
\t\t_ = tlsConn.SetDeadline(time.Time{})
\t\treturn result.conn, nil
\tcase <-ctx.Done():
\t\t_ = tlsConn.Close()
\t\treturn nil, ctx.Err()
\t}
}

func (t *utlsRoundTripper) RoundTrip(req *http.Request) (*http.Response, error) {
\thostname := req.URL.Hostname()
\tport := req.URL.Port()
\tif port == "" {
\t\tport = "443"
\t}
\taddr := net.JoinHostPort(hostname, port)

\th2Conn, errGet := t.getOrCreateConnection(req.Context(), hostname, addr)
\tif errGet != nil {
\t\treturn nil, errGet
\t}

\tresp, errTrip := h2Conn.RoundTrip(req)
\tif errTrip != nil {
\t\tremoved := false
\t\tt.mu.Lock()
\t\tif cached, ok := t.connections[hostname]; ok && cached == h2Conn {
\t\t\tdelete(t.connections, hostname)
\t\t\tremoved = true
\t\t}
\t\tt.mu.Unlock()
\t\tif removed {
\t\t\t_ = h2Conn.Close()
\t\t}
\t\treturn nil, errTrip
\t}

\treturn resp, nil
}

'''
          replace_region('type utlsRoundTripper struct {', '// utlsRoundTripperCache', transport)

          replace_once('return proxy.Direct, "", nil', 'return &net.Dialer{Timeout: 15 * time.Second}, "", nil')
          replace_once(
              '''\tif strings.HasPrefix(strings.ToLower(parsed.Scheme), "socks5") {
\t\tdialer, errFrom := proxy.FromURL(parsed, proxy.Direct)
\t\tif errFrom != nil {
\t\t\treturn nil, "", fmt.Errorf("build socks proxy dialer: %w", errFrom)
\t\t}
\t\treturn dialer, proxyURL, nil
\t}''',
              '''\tif strings.HasPrefix(strings.ToLower(parsed.Scheme), "socks5") {
\t\tdialURL := *parsed
\t\tif strings.EqualFold(dialURL.Scheme, "socks5h") {
\t\t\tdialURL.Scheme = "socks5"
\t\t}
\t\tforward := &net.Dialer{Timeout: 15 * time.Second}
\t\tdialer, errFrom := proxy.FromURL(&dialURL, forward)
\t\tif errFrom != nil {
\t\t\treturn nil, "", fmt.Errorf("build socks proxy dialer: %w", errFrom)
\t\t}
\t\treturn dialer, proxyURL, nil
\t}''',
          )

          proxy_connect = '''func (d *httpConnectDialer) Dial(network, addr string) (net.Conn, error) {
\tctx, cancel := context.WithTimeout(context.Background(), 15*time.Second)
\tdefer cancel()
\treturn d.DialContext(ctx, network, addr)
}

func (d *httpConnectDialer) DialContext(ctx context.Context, network, addr string) (net.Conn, error) {
\treturn d.dialConnect(ctx, network, addr)
}

func proxyTLSConfig(host string) *stdtls.Config {
\treturn &stdtls.Config{
\t\tServerName: host,
\t\tMinVersion: stdtls.VersionTLS12,
\t\tNextProtos: []string{"http/1.1"},
\t}
}

func (d *httpConnectDialer) dialConnect(ctx context.Context, _, addr string) (net.Conn, error) {
\tproxyAddr := d.proxyURL.Host
\tif !strings.Contains(proxyAddr, ":") {
\t\tif strings.EqualFold(d.proxyURL.Scheme, "https") {
\t\t\tproxyAddr = net.JoinHostPort(proxyAddr, "443")
\t\t} else {
\t\t\tproxyAddr = net.JoinHostPort(proxyAddr, "80")
\t\t}
\t}

\tnetDialer := &net.Dialer{Timeout: 15 * time.Second}
\trawConn, errDial := netDialer.DialContext(ctx, "tcp", proxyAddr)
\tif errDial != nil {
\t\treturn nil, fmt.Errorf("dial proxy %s: %w", proxyAddr, errDial)
\t}
\tif deadline, ok := ctx.Deadline(); ok {
\t\t_ = rawConn.SetDeadline(deadline)
\t}

\tif strings.EqualFold(d.proxyURL.Scheme, "https") {
\t\ttlsConn := stdtls.Client(rawConn, proxyTLSConfig(d.proxyURL.Hostname()))
\t\tif errHandshake := tlsConn.HandshakeContext(ctx); errHandshake != nil {
\t\t\t_ = rawConn.Close()
\t\t\treturn nil, fmt.Errorf("tls handshake to proxy %s: %w", proxyAddr, errHandshake)
\t\t}
\t\trawConn = tlsConn
\t}

\tconnectReq, errReq := http.NewRequestWithContext(ctx, http.MethodConnect, "https://"+addr, nil)
\tif errReq != nil {
\t\t_ = rawConn.Close()
\t\treturn nil, errReq
\t}
\tconnectReq.Host = addr
\tif d.proxyURL.User != nil {
\t\tif username := d.proxyURL.User.Username(); username != "" {
\t\t\tpassword, _ := d.proxyURL.User.Password()
\t\t\tconnectReq.Header.Set("Proxy-Authorization", "Basic "+base64.StdEncoding.EncodeToString([]byte(username+":"+password)))
\t\t}
\t}
\tif errWrite := connectReq.Write(rawConn); errWrite != nil {
\t\t_ = rawConn.Close()
\t\treturn nil, fmt.Errorf("write CONNECT to proxy %s: %w", proxyAddr, errWrite)
\t}

\tbr := bufio.NewReader(rawConn)
\tresp, errRead := http.ReadResponse(br, connectReq)
\tif errRead != nil {
\t\t_ = rawConn.Close()
\t\treturn nil, fmt.Errorf("read CONNECT response from proxy %s: %w", proxyAddr, errRead)
\t}
\t_ = resp.Body.Close()
\tif resp.StatusCode != http.StatusOK {
\t\t_ = rawConn.Close()
\t\treturn nil, fmt.Errorf("proxy %s rejected CONNECT to %s: %s", proxyAddr, addr, resp.Status)
\t}
\t_ = rawConn.SetDeadline(time.Time{})

\tif br.Buffered() > 0 {
\t\treturn &bufferedConn{r: br, Conn: rawConn}, nil
\t}
\treturn rawConn, nil
}

'''
          replace_region('func (d *httpConnectDialer) Dial(network, addr string)', '// bufferedConn', proxy_connect)

          replace_once(
              '''\t\tif parsed != nil {
\t\t\tstandard := http.DefaultTransport.(*http.Transport).Clone()
\t\t\tstandard.Proxy = http.ProxyURL(parsed)
\t\t\tfallback = standard
\t\t}''',
              '''\t\tif parsed != nil {
\t\t\tstandardProxy := *parsed
\t\t\tif strings.EqualFold(standardProxy.Scheme, "socks5h") {
\t\t\t\tstandardProxy.Scheme = "socks5"
\t\t\t}
\t\t\tstandard := http.DefaultTransport.(*http.Transport).Clone()
\t\t\tstandard.Proxy = http.ProxyURL(&standardProxy)
\t\t\tfallback = standard
\t\t}''',
          )

          referrals = '''func fetchReferralCapacity(ctx context.Context, cfg pluginConfig, credential codexCredential, account accountInfo, requestCookie, proxyURL string) (referralsResponse, error) {
\tresult := referralsResponse{Account: account}
\tanySuccess := false

\ttype probeOutcome struct {
\t\tstatusCode int
\t\traw        []byte
\t\tsuccess    bool
\t\thit        bool
\t\terr        error
\t}
\tprobe := func(endpointPath string) probeOutcome {
\t\tstatus, _, raw, errGet := codexGet(ctx, cfg, credential, endpointPath, requestCookie, proxyURL)
\t\tsuccess := errGet == nil && status >= 200 && status < 300
\t\treturn probeOutcome{statusCode: status, raw: raw, success: success, hit: success && len(raw) > 0, err: errGet}
\t}
\tprobeURL := func(fullURL string) probeOutcome {
\t\tstatus, _, raw, errGet := codexGetURL(ctx, cfg, credential, fullURL, requestCookie, proxyURL)
\t\tsuccess := errGet == nil && status >= 200 && status < 300
\t\treturn probeOutcome{statusCode: status, raw: raw, success: success, hit: success && len(raw) > 0, err: errGet}
\t}

\tprogramID := referralProgramForAccount(account)
\thasCookie := strings.TrimSpace(requestCookie) != "" || strings.TrimSpace(cfg.Cookie) != ""

\teligBaseURL, errEligURL := codexEndpoint(cfg.BaseURL, inviteEligibilityEndpointPath)
\tif errEligURL == nil {
\t\teligURL := eligBaseURL + "?program_id=" + url.QueryEscape(programID) + "&entrypoint=" + entrypointPersistent
\t\tpreviewHeaders := http.Header{"OpenAI-Internal-Referral-Eligibility-Preview": []string{"true"}}
\t\teligStatus, _, eligRaw, eligErr := codexGetURLWithHeaders(ctx, cfg, credential, eligURL, requestCookie, proxyURL, previewHeaders)
\t\tresult.EligibilityStatus = eligStatus
\t\tif eligErr == nil && eligStatus >= 200 && eligStatus < 300 {
\t\t\tanySuccess = true
\t\t\tif len(eligRaw) > 0 {
\t\t\t\tresult.EligibilityHit = true
\t\t\t\tresult.Eligibility = jsonRawMessage(eligRaw)
\t\t\t\tliftEligibilityFields(&result, eligRaw)
\t\t\t}
\t\t} else if !hasCookie && eligStatus == http.StatusForbidden {
\t\t\tresult.Note = "邀请资格端点需要浏览器 Cookie；请在 Cookie 输入框填入该账号的浏览器 Cookie 后重试。"
\t\t}
\t}

\ttrackBaseURL, errTrackURL := codexEndpoint(cfg.BaseURL, inviteTrackingEndpointPath)
\tif errTrackURL == nil {
\t\ttrackURL := trackBaseURL + "?limit=100&period=past_90_days&program_id=" + url.QueryEscape(programID)
\t\ttrack := probeURL(trackURL)
\t\tanySuccess = anySuccess || track.success
\t\tresult.TrackingHit = track.hit
\t\tif track.hit {
\t\t\tresult.Tracking = jsonRawMessage(track.raw)
\t\t\tliftTrackingCount(&result, track.raw)
\t\t}
\t}

\tresetCredits := probe(resetCreditsEndpointPath)
\tanySuccess = anySuccess || resetCredits.success
\tresult.ResetCreditsHit = resetCredits.hit
\tif resetCredits.hit {
\t\tresult.ResetCredits = jsonRawMessage(resetCredits.raw)
\t}

\tstatus := probe(referralsStatusEndpointPath)
\tanySuccess = anySuccess || status.success
\tresult.StatusStatusCode = status.statusCode
\tif status.hit {
\t\tresult.StatusEndpointHit = true
\t\tliftReferralFields(&result, status.raw, "status")
\t}

\tcredits := probe(referralsCreditsEndpointPath)
\tanySuccess = anySuccess || credits.success
\tresult.ReferralCreditsStatus = credits.statusCode
\tresult.ReferralCreditsHit = credits.hit
\tif credits.hit {
\t\tresult.ReferralCredits = jsonRawMessage(credits.raw)
\t\tliftReferralFields(&result, credits.raw, "credits")
\t}

\tif !result.EligibilityHit && !status.hit && !credits.hit {
\t\tusage, errUsage := fetchCodexUsage(ctx, cfg, credential, account, requestCookie, proxyURL)
\t\tif errUsage == nil && usage.StatusCode >= 200 && usage.StatusCode < 300 {
\t\t\tanySuccess = true
\t\t\tresult.UsageEndpointUsed = true
\t\t\tif result.Note == "" {
\t\t\t\tresult.Note = "专门邀请端点未返回数据，已回退显示 Codex 用量载荷。"
\t\t\t}
\t\t\tif usage.Upstream != nil {
\t\t\t\tif raw, errMarshal := json.Marshal(usage.Upstream); errMarshal == nil {
\t\t\t\t\tliftReferralFields(&result, raw, "usage")
\t\t\t\t}
\t\t\t} else if usage.UpstreamRaw != "" {
\t\t\t\tresult.UpstreamRaw = usage.UpstreamRaw
\t\t\t}
\t\t}
\t}

\tif !anySuccess {
\t\tmessage := fmt.Sprintf("all referral-related upstream probes failed (eligibility=%d, status=%d, credits=%d)", result.EligibilityStatus, result.StatusStatusCode, result.ReferralCreditsStatus)
\t\tif !hasCookie && result.EligibilityStatus == http.StatusForbidden {
\t\t\tmessage += "; eligibility requires a browser Cookie"
\t\t}
\t\treturn referralsResponse{}, httpStatusError{status: http.StatusBadGateway, msg: message}
\t}
\tresult.OK = true
\treturn result, nil
}

'''
          replace_region('func fetchReferralCapacity(ctx context.Context,', '// jsonRawMessage', referrals)

          replace_once(
              '''\t// remaining_reward_capacity = how many more rewards you can still earn.
\tif v, ok := data["remaining_reward_capacity"]; ok && v != nil {
\t\tresult.MaxInvites = v
\t}''',
              '''\t// remaining_reward_capacity is distinct from the send-cap ceiling.
