name: One-shot invite URL security hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/invite-url-security-trigger.md

permissions:
  contents: write

jobs:
  harden:
    if: github.repository == 'Hylouis233/codex-new-invite'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Patch, validate, and update main
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          main_path = Path('main.go')
          text = main_path.read_text(encoding='utf-8')

          helper = """    function safeInviteURL(raw) {
              try {
                const candidate = new URL(String(raw || ''));
                if (candidate.protocol !== 'https:') return '';
                if (candidate.username || candidate.password) return '';
                return candidate.href;
              } catch (error) {
                return '';
              }
            }

          """
          marker = "    function clearResult() {\n"
          if "function safeInviteURL(raw)" not in text:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'clearResult insertion marker count={count}, want 1')
              text = text.replace(marker, helper + marker, 1)

          old = """          const link = document.createElement('a');
                    link.href = invite.invite_url;
                    link.target = '_blank';
                    link.rel = 'noreferrer';
                    link.textContent = (invite.email || 'invite') + ': ' + invite.invite_url;
                    linksBox.appendChild(link);
          """
          new = """          const label = (invite.email || 'invite') + ': ' + invite.invite_url;
                    const inviteURL = safeInviteURL(invite.invite_url);
                    if (!inviteURL) {
                      const text = document.createElement('span');
                      text.textContent = label;
                      linksBox.appendChild(text);
                      continue;
                    }
                    const link = document.createElement('a');
                    link.href = inviteURL;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = label;
                    linksBox.appendChild(link);
          """
          if old in text:
              text = text.replace(old, new, 1)
          elif "const inviteURL = safeInviteURL(invite.invite_url);" not in text:
              raise SystemExit('invite link rendering block was not found')

          if "link.href = invite.invite_url;" in text:
              raise SystemExit('unsafe direct invite URL assignment remains')
          main_path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('ui_security_test.go')
          tests = test_path.read_text(encoding='utf-8')
          test_block = r'''

          func TestInvitePageRestrictsInviteLinksToHTTPS(t *testing.T) {
          	page := renderInvitePage(defaultConfig())
          	for _, required := range []string{
          		"function safeInviteURL(raw)",
          		"if (candidate.protocol !== 'https:') return '';",
          		"if (candidate.username || candidate.password) return '';",
          		"const inviteURL = safeInviteURL(invite.invite_url);",
          		"link.href = inviteURL;",
          		"link.rel = 'noopener noreferrer';",
          	} {
          		if !strings.Contains(page, required) {
          			t.Fatalf("invite page is missing safe URL marker %q", required)
          		}
          	}
          	for _, forbidden := range []string{
          		"link.href = invite.invite_url;",
          		"link.rel = 'noreferrer';",
          	} {
          		if strings.Contains(page, forbidden) {
          			t.Fatalf("invite page still contains unsafe URL marker %q", forbidden)
          		}
          	}
          }
          '''
          if "func TestInvitePageRestrictsInviteLinksToHTTPS" not in tests:
              tests = tests.rstrip() + test_block + "\n"
          test_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

          gofmt -w main.go ui_security_test.go
          make test
          make vet
          git diff --check
          if git grep -nF 'link.href = invite.invite_url;' -- main.go; then
            echo 'unsafe direct invite URL assignment remains' >&2
            exit 1
          fi

          rm -f .github/workflows/one-shot-invite-url-security.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: validate invite links before navigation'
          git push origin HEAD:main
